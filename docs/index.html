<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAPbot - Tommie Athletics Standings</title>
  <style>
    :root {
      --bg: #0c0d10;
      --card-bg: #14161d;
      --card-header: #1a1e28;
      --border: #262c3a;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --ust-purple: #510C76;
      --ust-purple-accent: #8b2fc9;
      --ust-highlight: rgba(139, 47, 201, 0.18);
      --badge-ok-bg: #14532d;
      --badge-ok-txt: #4ade80;
      --badge-stale-bg: #713f12;
      --badge-stale-txt: #fde047;
      --badge-error-bg: #450a0a;
      --badge-error-txt: #f87171;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem;
    }

    /* Container configured for 2 side-by-side cards on desktop */
    .container {
      max-width: 1480px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .header-links {
      margin-top: 0.6rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
    }

    .json-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #c084fc;
      background: rgba(139, 47, 201, 0.15);
      border: 1px solid rgba(139, 47, 201, 0.35);
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .json-link:hover {
      background: rgba(139, 47, 201, 0.28);
      color: #e9d5ff;
      border-color: var(--ust-purple-accent);
    }

    /* Controls Bar & Filters */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.8rem;
      padding: 0.9rem 1.4rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      background: #1e2433;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: #fff;
      border-color: var(--ust-purple-accent);
    }

    .filter-btn.active {
      background: var(--ust-purple);
      color: #fff;
      border-color: var(--ust-purple-accent);
      box-shadow: 0 2px 8px rgba(81, 12, 118, 0.4);
    }

    .last-generated {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* Grid Layout: 2 items per row on desktop */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.75rem;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
      width: 100%;
    }

    .card:hover {
      border-color: #3b4254;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.3rem;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
    }

    .card-title-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .card-league {
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.72rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-ok     { background: var(--badge-ok-bg); color: var(--badge-ok-txt); }
    .badge-stale  { background: var(--badge-stale-bg); color: var(--badge-stale-txt); }
    .badge-error  { background: var(--badge-error-bg); color: var(--badge-error-txt); }

    /* Tables */
    .table-wrap {
      width: 100%;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      table-layout: auto;
    }

    thead th {
      padding: 0.7rem 1rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: #11141b;
      white-space: nowrap;
    }

    thead th.num {
      text-align: center;
    }

    tbody tr {
      border-bottom: 1px solid #1a1e2a;
      transition: background 0.15s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #1c212e;
    }

    /* St. Thomas Row Highlight */
    tbody tr.highlight-ust {
      background: var(--ust-highlight);
      font-weight: 600;
    }

    tbody tr.highlight-ust td.team-cell .team-name {
      color: #e9d5ff;
      font-weight: 700;
    }
/* Poll Trend & Rank Badges */
    .rank-top3 {
      color: #fbbf24 !important;
    }

    td.trend-cell {
      text-align: center;
      width: 58px;
    }

    .trend-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      font-size: 0.72rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .trend-up {
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
    }

    .trend-down {
      color: #f87171;
      background: rgba(248, 113, 113, 0.12);
    }

    .trend-same {
      color: var(--text-muted);
    }

    .trend-new {
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
    }
    
    td {
      padding: 0.65rem 1rem;
      vertical-align: middle;
    }

    td.rank {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      width: 48px;
    }

    td.team-cell {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .team-acronym {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.18rem 0.45rem;
      border-radius: 4px;
      background: #1e2433;
      color: #cbd5e1;
      letter-spacing: 0.04em;
      display: inline-block;
      text-align: center;
      min-width: 42px;
    }

    .highlight-ust .team-acronym {
      background: var(--ust-purple);
      color: #fff;
      box-shadow: 0 0 6px rgba(139, 47, 201, 0.5);
    }

    .team-name {
      color: #f1f5f9;
      font-weight: 500;
      white-space: nowrap;
    }

    td.record {
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: #cbd5e1;
      white-space: nowrap;
      width: 110px;
    }

    td.pts-col {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #a855f7;
      white-space: nowrap;
      width: 90px;
    }

    .card-footer {
      padding: 0.65rem 1.2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #11141b;
    }

    .card-footer a {
      color: #a855f7;
      text-decoration: none;
      font-weight: 600;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }
    /* Date badge next to title */
    .poll-date-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      margin-left: 0.5rem;
      vertical-align: middle;
      text-transform: none;
    }

    /* Receiving votes small text below the table */
    .receiving-votes {
      font-size: 0.75rem;
      line-height: 1.4;
      color: var(--text-muted);
      padding: 0.65rem 1.2rem;
      background: #11141b;
      border-top: 1px solid var(--border);
    }

    .receiving-votes .rv-label {
      font-weight: 700;
      color: #cbd5e1;
    }

    /* States & Messages */
    .message {
      padding: 2.5rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .message-icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      display: block;
    }
  </style>
</head>
<body>


  
  <div class="container">
    <header>
      <h1>TAPbot - Tommie Athletics Standings</h1>
      <div class="header-links">
        <a href="data.json" target="_blank" rel="noopener" class="json-link">
          📄 View Raw JSON (data.json)
        </a>
      </div>
    </header>

    <div class="controls">
      <div class="filter-group" id="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="fall">Fall Sports</button>
        <button class="filter-btn" data-filter="winter">Winter Sports</button>
        <button class="filter-btn" data-filter="spring">Spring Sports</button>
      </div>
      <div class="last-generated" id="last-generated-time">Loading feed…</div>
    </div>

    <div class="grid" id="sports-grid">
      <div class="card" style="grid-column: 1 / -1;">
        <div class="message">
          <span class="message-icon">⏳</span>
          Loading live standings and polls from data.json…
        </div>
      </div>
    </div>
  </div>

  <script>
    let sportsData = {};
    let activeFilter = "all";

    // Ordering definition: ensures winter sports place polls directly below their conference tables
    const DISPLAY_ORDER = [
      // Fall
      "wsoc",
      "msoc",
      "pfl",
      "wvball",
      // Winter (Standings paired immediately with their national polls)
      "whockey",
      "uscho_womens_poll",
      "mhockey",
      "uscho_mens_poll",
      "wbball",
      "mbball",
      // Spring
      "summit_193",
      "summit_195"
    ];

    // Season category mapping
    const SEASON_MAP = {
      // Fall
      wsoc: "fall",
      msoc: "fall",
      pfl: "fall",
      wvball: "fall",
      // Winter
      whockey: "winter",
      uscho_womens_poll: "winter",
      mhockey: "winter",
      uscho_mens_poll: "winter",
      wbball: "winter",
      mbball: "winter",
      // Spring
      summit_193: "spring",
      summit_195: "spring"
    };

    async function loadData() {
      const grid = document.getElementById("sports-grid");
      const metaTime = document.getElementById("last-generated-time");

      try {
        const res = await fetch("data.json?_=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        sportsData = data.sports || {};

        if (data.generated_at) {
          const genDate = new Date(data.generated_at);
          metaTime.textContent = "Feed updated: " + genDate.toLocaleString(undefined, {
            month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short"
          });
        } else {
          metaTime.textContent = "Feed loaded";
        }

        renderGrid();
      } catch (err) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1;">
            <div class="message">
              <span class="message-icon">⚠️</span>
              Could not load feed: ${err.message}<br/>
              <small style="color:#64748b; margin-top:0.5rem; display:block;">Ensure data.json is in the docs/ directory.</small>
            </div>
          </div>
        `;
        metaTime.textContent = "Connection error";
      }
    }

    function getSeasonCategory(sportId) {
      return SEASON_MAP[sportId] || "other";
    }

    function renderGrid() {
      const grid = document.getElementById("sports-grid");
      
      // Collect entries according to custom DISPLAY_ORDER, followed by any additional keys
      const knownKeys = DISPLAY_ORDER.filter(id => sportsData[id]);
      const remainingKeys = Object.keys(sportsData).filter(id => !DISPLAY_ORDER.includes(id));
      const sortedKeys = [...knownKeys, ...remainingKeys];

      if (sortedKeys.length === 0) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1;">
            <div class="message">No sport standings or polls available in feed.</div>
          </div>
        `;
        return;
      }

      const filtered = sortedKeys.filter(id => {
        if (activeFilter === "all") return true;
        return getSeasonCategory(id) === activeFilter;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1;">
            <div class="message">No tables found for this season filter.</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(id => buildCard(id, sportsData[id])).join("");
    }

    function buildCard(id, s) {
      const isError = s.status === "error" || !s.rows || s.rows.length === 0;
      const isStale = s.status === "stale";
      const isPoll = id.includes("poll") || s.type === "poll";

      let badgeClass = "badge-ok";
      let badgeText = isPoll ? "National Poll" : "Live";

      if (isError) {
        badgeClass = "badge-error";
        badgeText = "Off Season / Error";
      } else if (isStale) {
        badgeClass = "badge-stale";
        badgeText = "⚠ Stale";
      }

      let bodyContent = "";

      if (isError) {
        const errorMsg = s.error || "No current active data found.";
        bodyContent = `
          <div class="message">
            <span class="message-icon">📋</span>
            ${escHtml(errorMsg)}
          </div>
        `;
      } else if (isPoll) {
        // Table layout for USCHO National Polls with Trend & Last Poll
        bodyContent = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="num">#</th>
                  <th>Team</th>
                  <th class="num">Record</th>
                  <th class="num pts-col">Pts (1st)</th>
                  <th class="num">Last</th>
                  <th class="num">Chg</th>
                </tr>
              </thead>
              <tbody>
                ${s.rows.map(r => {
                  const isUST = r.team && r.team.toLowerCase().includes("st. thomas");
                  const top3Class = r.rank <= 3 ? "rank-top3" : "";

                  let trendClass = "trend-same";
                  let trendSymbol = r.trend || "=";

                  if (r.trend_dir === "up") {
                    trendClass = "trend-up";
                    trendSymbol = `▲ ${r.trend.replace('+', '')}`;
                  } else if (r.trend_dir === "down") {
                    trendClass = "trend-down";
                    trendSymbol = `▼ ${r.trend.replace('-', '')}`;
                  } else if (r.trend_dir === "new") {
                    trendClass = "trend-new";
                    trendSymbol = "NEW";
                  }

                  return `
                    <tr class="${isUST ? 'highlight-ust' : ''}">
                      <td class="rank ${top3Class}">${r.rank}</td>
                      <td>
                        <div class="team-cell">
                          <span class="team-name">${escHtml(r.team)}</span>
                        </div>
                      </td>
                      <td class="record">${escHtml(r.record || '—')}</td>
                      <td class="pts-col">${escHtml(r.pts || '—')}</td>
                      <td class="record">${escHtml(r.last_poll || 'NR')}</td>
                      <td class="trend-cell">
                        <span class="trend-badge ${trendClass}">${trendSymbol}</span>
                      </td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      } else {
        // Table layout for Conference Standings (Rank, Team + Acronym, Conf, Overall, CPTS/PTS)
        const hasCpts = s.rows && s.rows.some(r => r.cpts !== undefined);
        const hasPts  = s.rows && s.rows.some(r => r.pts !== undefined);
        const ptsHeader = hasCpts ? "CPTS" : (hasPts ? "PTS" : null);

        bodyContent = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="num">#</th>
                  <th>Team</th>
                  <th class="num">Conf</th>
                  <th class="num">Overall</th>
                  ${ptsHeader ? `<th class="num pts-col">${ptsHeader}</th>` : ""}
                </tr>
              </thead>
              <tbody>
                ${s.rows.map(r => {
                  const isUST = r.acronym === "UST" || (r.team && r.team.toLowerCase().includes("st. thomas"));
                  const ptsVal = hasCpts ? (r.cpts ?? "—") : (hasPts ? (r.pts ?? "—") : null);

                  return `
                    <tr class="${isUST ? 'highlight-ust' : ''}">
                      <td class="rank">${r.rank}</td>
                      <td>
                        <div class="team-cell">
                          <span class="team-acronym">${escHtml(r.acronym || '—')}</span>
                          <span class="team-name">${escHtml(r.team)}</span>
                        </div>
                      </td>
                      <td class="record">${escHtml(r.conf)}</td>
                      <td class="record">${escHtml(r.ovr)}</td>
                      ${ptsHeader ? `<td class="pts-col">${escHtml(ptsVal)}</td>` : ""}
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      // --- ADDED: Poll Date in Header & Receiving Votes Footer ---
      const dateBadge = s.poll_date ? `<span class="poll-date-badge">${escHtml(s.poll_date)}</span>` : "";
      
      const receivingVotesHtml = (isPoll && s.receiving_votes) ? `
        <div class="receiving-votes">
          <span class="rv-label">Others receiving votes:</span> ${escHtml(s.receiving_votes)}
        </div>
      ` : "";

      const sourceLinkText = isPoll ? "Official USCHO Poll ↗" : "Official Standings ↗";
      const sourceLink = s.source ? `<a href="${escHtml(s.source)}" target="_blank" rel="noopener">${sourceLinkText}</a>` : `<span></span>`;
      const updatedTime = s.updated_at ? new Date(s.updated_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title-group">
              <div class="card-league">${escHtml(getLeagueLabel(id))}</div>
              <h2 class="card-title">${escHtml(s.name || id)}${dateBadge}</h2>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          ${bodyContent}
          ${receivingVotesHtml}
          <div class="card-footer">
            ${sourceLink}
            <span>${updatedTime ? 'Scanned ' + updatedTime : ''}</span>
          </div>
        </div>
      `;
    } else {
        // Table layout for Conference Standings (Rank, Team + Acronym, Conf, Overall, CPTS/PTS)
        const hasCpts = s.rows && s.rows.some(r => r.cpts !== undefined);
        const hasPts  = s.rows && s.rows.some(r => r.pts !== undefined);
        const ptsHeader = hasCpts ? "CPTS" : (hasPts ? "PTS" : null);

        bodyContent = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="num">#</th>
                  <th>Team</th>
                  <th class="num">Conf</th>
                  <th class="num">Overall</th>
                  ${ptsHeader ? `<th class="num pts-col">${ptsHeader}</th>` : ""}
                </tr>
              </thead>
              <tbody>
                ${s.rows.map(r => {
                  const isUST = r.acronym === "UST" || (r.team && r.team.toLowerCase().includes("st. thomas"));
                  const ptsVal = hasCpts ? (r.cpts ?? "—") : (hasPts ? (r.pts ?? "—") : null);

                  return `
                    <tr class="${isUST ? 'highlight-ust' : ''}">
                      <td class="rank">${r.rank}</td>
                      <td>
                        <div class="team-cell">
                          <span class="team-acronym">${escHtml(r.acronym || '—')}</span>
                          <span class="team-name">${escHtml(r.team)}</span>
                        </div>
                      </td>
                      <td class="record">${escHtml(r.conf)}</td>
                      <td class="record">${escHtml(r.ovr)}</td>
                      ${ptsHeader ? `<td class="pts-col">${escHtml(ptsVal)}</td>` : ""}
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      const sourceLinkText = isPoll ? "Official USCHO Poll ↗" : "Official Standings ↗";
      const sourceLink = s.source ? `<a href="${escHtml(s.source)}" target="_blank" rel="noopener">${sourceLinkText}</a>` : `<span></span>`;
      const updatedTime = s.updated_at ? new Date(s.updated_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title-group">
              <div class="card-league">${escHtml(getLeagueLabel(id))}</div>
              <h2 class="card-title">${escHtml(s.name || id)}</h2>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          ${bodyContent}
          <div class="card-footer">
            ${sourceLink}
            <span>${updatedTime ? 'Scanned ' + updatedTime : ''}</span>
          </div>
        </div>
      `;
    }

    function getLeagueLabel(id) {
      if (id === "pfl") return "Pioneer Football League";
      if (id === "mhockey") return "NCHC Men's Ice Hockey";
      if (id === "whockey") return "WCHA Women's Ice Hockey";
      if (id === "uscho_mens_poll") return "National Ranking • USCHO";
      if (id === "uscho_womens_poll") return "National Ranking • USCHO";
      return "Summit League";
    }

    function escHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Filter button handlers
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderGrid();
      });
    });

    loadData();
  </script>

</body>
</html>
