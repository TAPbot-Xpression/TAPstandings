<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summit League, PFL & Ice Hockey Standings & Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-card: #111827;
      --bg-card-header: #1a2234;
      --border-color: #232f48;
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --trend-up: #10b981;
      --trend-down: #ef4444;
      --trend-same: #64748b;
      --trend-new: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 2rem 1.25rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.25rem;
      gap: 1rem;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta-bar {
      font-size: 0.825rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Filter / Season Tabs */
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--accent-blue);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }

    /* Grid Layout */
    .boards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 1.5rem;
    }

    @media (max-width: 480px) {
      .boards-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    .card-header {
      background-color: var(--bg-card-header);
      padding: 0.85rem 1.15rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .card-badge.poll {
      background: rgba(139, 92, 246, 0.15);
      color: #c084fc;
    }

    /* Tables */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.825rem;
      text-align: left;
    }

    th {
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-weight: 600;
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    td {
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .cell-center {
      text-align: center;
    }

    .cell-right {
      text-align: right;
    }

    .rank-cell {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--text-muted);
      width: 40px;
    }

    .rank-top3 {
      color: #fbbf24;
    }

    .team-cell {
      font-weight: 600;
    }

    .team-cell .acronym {
      color: var(--text-faint);
      font-size: 0.75rem;
      margin-left: 0.35rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .mono-cell {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
    }

    .pts-cell {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: #60a5fa;
    }

    /* Trend Indicators for Polls */
    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
    }

    .trend-up {
      color: var(--trend-up);
      background: rgba(16, 185, 129, 0.12);
    }

    .trend-down {
      color: var(--trend-down);
      background: rgba(239, 68, 68, 0.12);
    }

    .trend-same {
      color: var(--trend-same);
    }

    .trend-new {
      color: var(--trend-new);
      background: rgba(245, 158, 11, 0.12);
    }

    .loading, .empty-state {
      padding: 3rem;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Collegiate Sports & Rankings Hub</h1>
        <div class="meta-bar" id="lastUpdated">Loading data...</div>
      </div>
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterBoards('all')">All</button>
        <button class="tab-btn" onclick="filterBoards('polls')">USCHO Polls</button>
        <button class="tab-btn" onclick="filterBoards('hockey')">Ice Hockey</button>
        <button class="tab-btn" onclick="filterBoards('summit')">Summit League</button>
      </div>
    </header>

    <div id="boardsContainer" class="boards-grid">
      <div class="loading">Loading standings & polls data...</div>
    </div>
  </div>

  <script>
    let globalData = null;
    let currentFilter = 'all';

    async function loadData() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        if (!res.ok) throw new Error('Failed to load data.json');
        globalData = await res.json();
        
        document.getElementById('lastUpdated').textContent = 
          'Last Updated: ' + new Date(globalData.generated_at).toLocaleString();
        
        render();
      } catch (err) {
        document.getElementById('boardsContainer').innerHTML = `
          <div class="empty-state">
            <p style="color: #ef4444; font-weight:600;">Error loading standings: ${err.message}</p>
            <p style="margin-top: 0.5rem; font-size:0.85rem;">Run the scraper script to generate data.json.</p>
          </div>
        `;
      }
    }

    function filterBoards(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function render() {
      if (!globalData || !globalData.sports) return;

      const container = document.getElementById('boardsContainer');
      container.innerHTML = '';

      const sports = Object.values(globalData.sports);

      const filtered = sports.filter(s => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'polls') return s.id.includes('poll');
        if (currentFilter === 'hockey') return s.id.includes('hockey');
        if (currentFilter === 'summit') return s.id.includes('summit') || ['wsoc','msoc','wvball','wbball','mbball'].includes(s.id);
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No boards found for selected filter.</div>';
        return;
      }

      filtered.forEach(sport => {
        const isPoll = sport.id.includes('poll');
        const card = document.createElement('div');
        card.className = 'card';

        let tableHeaderHtml = '';
        if (isPoll) {
          tableHeaderHtml = `
            <thead>
              <tr>
                <th class="cell-center">#</th>
                <th>Team</th>
                <th class="cell-center">Record</th>
                <th class="cell-right">Pts (1st)</th>
                <th class="cell-center">Last</th>
                <th class="cell-center">Chg</th>
              </tr>
            </thead>
          `;
        } else {
          const hasCpts = sport.rows && sport.rows.some(r => r.cpts !== undefined);
          const hasPts = sport.rows && sport.rows.some(r => r.pts !== undefined);
          
          tableHeaderHtml = `
            <thead>
              <tr>
                <th class="cell-center">#</th>
                <th>Team</th>
                <th class="cell-center">Conf</th>
                <th class="cell-center">Ovr</th>
                ${hasCpts ? '<th class="cell-right">CPTS</th>' : ''}
                ${hasPts ? '<th class="cell-right">PTS</th>' : ''}
              </tr>
            </thead>
          `;
        }

        let tableRowsHtml = '';
        if (sport.rows && sport.rows.length > 0) {
          tableRowsHtml = sport.rows.map((row, idx) => {
            const rankClass = row.rank <= 3 ? 'rank-cell rank-top3' : 'rank-cell';

            if (isPoll) {
              let trendClass = 'trend-same';
              let trendSymbol = row.trend;
              if (row.trend_dir === 'up') {
                trendClass = 'trend-up';
                trendSymbol = '▲ ' + row.trend.replace('+', '');
              } else if (row.trend_dir === 'down') {
                trendClass = 'trend-down';
                trendSymbol = '▼ ' + row.trend.replace('-', '');
              } else if (row.trend_dir === 'new') {
                trendClass = 'trend-new';
                trendSymbol = 'NEW';
              }

              return `
                <tr>
                  <td class="${rankClass} cell-center">${row.rank}</td>
                  <td class="team-cell">${row.team}</td>
                  <td class="mono-cell cell-center">${row.record || '—'}</td>
                  <td class="pts-cell cell-right">${row.pts}</td>
                  <td class="mono-cell cell-center">${row.last_poll || 'NR'}</td>
                  <td class="cell-center">
                    <span class="trend-badge ${trendClass}">${trendSymbol}</span>
                  </td>
                </tr>
              `;
            } else {
              return `
                <tr>
                  <td class="${rankClass} cell-center">${row.rank || (idx + 1)}</td>
                  <td class="team-cell">
                    ${row.team}
                    ${row.acronym ? `<span class="acronym">${row.acronym}</span>` : ''}
                  </td>
                  <td class="mono-cell cell-center">${row.conf || '—'}</td>
                  <td class="mono-cell cell-center">${row.ovr || '—'}</td>
                  ${row.cpts !== undefined ? `<td class="pts-cell cell-right">${row.cpts}</td>` : ''}
                  ${row.pts !== undefined ? `<td class="pts-cell cell-right">${row.pts}</td>` : ''}
                </tr>
              `;
            }
          }).join('');
        } else {
          tableRowsHtml = `<tr><td colspan="6" class="cell-center mono-cell" style="padding: 1.5rem;">No data available</td></tr>`;
        }

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${sport.name}</span>
            <span class="card-badge ${isPoll ? 'poll' : ''}">${isPoll ? 'USCHO Top 20' : 'Standings'}</span>
          </div>
          <div class="table-container">
            <table>
              ${tableHeaderHtml}
              <tbody>
                ${tableRowsHtml}
              </tbody>
            </table>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Auto-fetch on boot
    loadData();
  </script>
</body>
</html>
