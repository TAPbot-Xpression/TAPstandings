<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAPbot - Tommie Athletics Standings</title>
  <style>
    :root {
      --bg: #0c0d10;
      --card-bg: #14161d;
      --card-header: #1a1e28;
      --border: #262c3a;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --ust-purple: #510C76;
      --ust-purple-accent: #8b2fc9;
      --ust-highlight: rgba(139, 47, 201, 0.18);
      --badge-ok-bg: #14532d;
      --badge-ok-txt: #4ade80;
      --badge-stale-bg: #713f12;
      --badge-stale-txt: #fde047;
      --badge-error-bg: #450a0a;
      --badge-error-txt: #f87171;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1rem 4rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .header-links {
      margin-top: 0.6rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
    }

    .json-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #c084fc;
      background: rgba(139, 47, 201, 0.15);
      border: 1px solid rgba(139, 47, 201, 0.35);
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .json-link:hover {
      background: rgba(139, 47, 201, 0.28);
      color: #e9d5ff;
      border-color: var(--ust-purple-accent);
    }

    /* Controls Bar & Filters */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.8rem;
      padding: 0.8rem 1.2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .filter-btn {
      background: #1e2433;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      color: #fff;
      border-color: var(--ust-purple-accent);
    }

    .filter-btn.active {
      background: var(--ust-purple);
      color: #fff;
      border-color: var(--ust-purple-accent);
      box-shadow: 0 2px 8px rgba(81, 12, 118, 0.4);
    }

    .last-generated {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1.5rem;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      border-color: #3b4254;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.2rem;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
    }

    .card-title-group {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }

    .card-league {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge-ok     { background: var(--badge-ok-bg); color: var(--badge-ok-txt); }
    .badge-stale  { background: var(--badge-stale-bg); color: var(--badge-stale-txt); }
    .badge-error  { background: var(--badge-error-bg); color: var(--badge-error-txt); }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    thead th {
      padding: 0.6rem 0.85rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: #11141b;
      white-space: nowrap;
    }

    thead th.num {
      text-align: center;
    }

    tbody tr {
      border-bottom: 1px solid #1a1e2a;
      transition: background 0.15s;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #1c212e;
    }

    /* St. Thomas Row Highlight */
    tbody tr.highlight-ust {
      background: var(--ust-highlight);
      font-weight: 600;
    }

    tbody tr.highlight-ust td.team-name {
      color: #e9d5ff;
    }

    td {
      padding: 0.6rem 0.85rem;
      white-space: nowrap;
    }

    td.rank {
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
      width: 2.2rem;
    }

    td.team-cell {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .team-acronym {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: #1e2433;
      color: #cbd5e1;
      letter-spacing: 0.04em;
    }

    .highlight-ust .team-acronym {
      background: var(--ust-purple);
      color: #fff;
      box-shadow: 0 0 6px rgba(139, 47, 201, 0.5);
    }

    .team-name {
      color: #f1f5f9;
      font-weight: 500;
    }

    td.record {
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: #cbd5e1;
    }

    td.pts-col {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: #a855f7;
    }

    .card-footer {
      padding: 0.55rem 1rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #11141b;
    }

    .card-footer a {
      color: #a855f7;
      text-decoration: none;
      font-weight: 600;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    /* States & Messages */
    .message {
      padding: 2.5rem 1.5rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .message-icon {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>TAPbot - Tommie Athletics Standings</h1>
      <div class="header-links">
        <a href="data.json" target="_blank" rel="noopener" class="json-link">
          📄 View Raw JSON (data.json)
        </a>
      </div>
    </header>

    <div class="controls">
      <div class="filter-group" id="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="fall">Fall Sports</button>
        <button class="filter-btn" data-filter="winter">Winter Sports</button>
        <button class="filter-btn" data-filter="spring">Spring Sports</button>
      </div>
      <div class="last-generated" id="last-generated-time">Loading feed…</div>
    </div>

    <div class="grid" id="sports-grid">
      <div class="card" style="grid-column: 1 / -1;">
        <div class="message">
          <span class="message-icon">⏳</span>
          Loading live standings from data.json…
        </div>
      </div>
    </div>
  </div>

  <script>
    let sportsData = {};
    let activeFilter = "all";

    // Season category mapping
    const SEASON_MAP = {
      // Fall
      wsoc: "fall",
      msoc: "fall",
      wvball: "fall",
      pfl: "fall",
      // Winter
      whockey: "winter",
      mhockey: "winter",
      wbball: "winter",
      mbball: "winter",
      // Spring
      summit_193: "spring",
      summit_195: "spring"
    };

    async function loadData() {
      const grid = document.getElementById("sports-grid");
      const metaTime = document.getElementById("last-generated-time");

      try {
        const res = await fetch("data.json?_=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        sportsData = data.sports || {};

        if (data.generated_at) {
          const genDate = new Date(data.generated_at);
          metaTime.textContent = "Feed updated: " + genDate.toLocaleString(undefined, {
            month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short"
          });
        } else {
          metaTime.textContent = "Feed loaded";
        }

        renderGrid();
      } catch (err) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1;">
            <div class="message">
              <span class="message-icon">⚠️</span>
              Could not load standings feed: ${err.message}<br/>
              <small style="color:#64748b; margin-top:0.5rem; display:block;">Ensure data.json is in the docs/ directory.</small>
            </div>
          </div>
        `;
        metaTime.textContent = "Connection error";
      }
    }

    function getSeasonCategory(sportId) {
      return SEASON_MAP[sportId] || "other";
    }

    function renderGrid() {
      const grid = document.getElementById("sports-grid");
      const entries = Object.entries(sportsData);

      if (entries.length === 0) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1;">
            <div class="message">No sport standings available in feed.</div>
          </div>
        `;
        return;
      }

      const filtered = entries.filter(([id]) => {
        if (activeFilter === "all") return true;
        return getSeasonCategory(id) === activeFilter;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1;">
            <div class="message">No sports found for this season filter.</div>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(([id, s]) => buildSportCard(id, s)).join("");
    }

    function buildSportCard(id, s) {
      const isError = s.status === "error" || !s.rows || s.rows.length === 0;
      const isStale = s.status === "stale";

      let badgeClass = "badge-ok";
      let badgeText = "Live";

      if (isError) {
        badgeClass = "badge-error";
        badgeText = "Off Season / Error";
      } else if (isStale) {
        badgeClass = "badge-stale";
        badgeText = "⚠ Stale";
      }

      // Check if sport has a points column (CPTS for soccer, PTS for hockey)
      const hasCpts = s.rows && s.rows.some(r => r.cpts !== undefined);
      const hasPts  = s.rows && s.rows.some(r => r.pts !== undefined);
      const ptsHeader = hasCpts ? "CPTS" : (hasPts ? "PTS" : null);

      let bodyContent = "";

      if (isError) {
        const errorMsg = s.error || "No current active standings found.";
        bodyContent = `
          <div class="message">
            <span class="message-icon">📋</span>
            ${escHtml(errorMsg)}
          </div>
        `;
      } else {
        bodyContent = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="num">#</th>
                  <th>Team</th>
                  <th class="num">Conf</th>
                  <th class="num">Overall</th>
                  ${ptsHeader ? `<th class="num pts-col">${ptsHeader}</th>` : ""}
                </tr>
              </thead>
              <tbody>
                ${s.rows.map(r => {
                  const isUST = r.acronym === "UST" || (r.team && r.team.toLowerCase().includes("st. thomas"));
                  const ptsVal = hasCpts ? (r.cpts ?? "—") : (hasPts ? (r.pts ?? "—") : null);

                  return `
                    <tr class="${isUST ? 'highlight-ust' : ''}">
                      <td class="rank">${r.rank}</td>
                      <td>
                        <div class="team-cell">
                          <span class="team-acronym">${escHtml(r.acronym || '—')}</span>
                          <span class="team-name">${escHtml(r.team)}</span>
                        </div>
                      </td>
                      <td class="record">${escHtml(r.conf)}</td>
                      <td class="record">${escHtml(r.ovr)}</td>
                      ${ptsHeader ? `<td class="pts-col">${escHtml(ptsVal)}</td>` : ""}
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      const sourceLink = s.source ? `<a href="${escHtml(s.source)}" target="_blank" rel="noopener">Official Standings ↗</a>` : `<span></span>`;
      const updatedTime = s.updated_at ? new Date(s.updated_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      return `
        <div class="card">
          <div class="card-header">
            <div class="card-title-group">
              <div class="card-league">${escHtml(getLeagueLabel(id))}</div>
              <h2 class="card-title">${escHtml(s.name || id)}</h2>
            </div>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          ${bodyContent}
          <div class="card-footer">
            ${sourceLink}
            <span>${updatedTime ? 'Scanned ' + updatedTime : ''}</span>
          </div>
        </div>
      `;
    }

    function getLeagueLabel(id) {
      if (id === "pfl") return "Pioneer Football League";
      if (id === "mhockey") return "NCHC Men's Ice Hockey";
      if (id === "whockey") return "WCHA Women's Ice Hockey";
      return "Summit League";
    }

    function escHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Filter button handlers
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderGrid();
      });
    });

    loadData();
  </script>

</body>
</html>
